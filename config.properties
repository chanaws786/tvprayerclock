# MCWAS TV Prayer Clock Configuration
# Colors (hex format)
backgroundcolor=165D42
rightpanecolour=5D1631

# Timing Offsets (in minutes)
TenMinSalahInProgressOffset=10
SalahInProgressOffset=5
SalahCountDownStart=60
JummahLenghthMin=20
LargeCountDown=20
KarahatTimeOffset=20
SunriseOffset=10
NextDayTriggerInMinutes=5

# Ramadan Settings
# Grey screen during Ramadan - configurable time window
enableRamadanGreyScreen=true
ramadanGreyScreenStart=01:15
ramadanGreyScreenEnd=02:30

# Test Mode (for testing grey screen at any time)
# Set testMode=true and specify testTime in HH:MM format (e.g., "1:30" for 1:30am)
testMode=false
#testTime=1:30
# Force Ramadan mode regardless of actual Hijri month
forceRamadanMode=true

# Data Source Configuration
# Leave empty to use local CSV files only
# Google Sheet published CSV URL
fileUrl=https://docs.google.com/spreadsheets/d/e/2PACX-1vT_yCyoT9XY7wE4xo1dbJHENZ8qEMBDYYB7sbaFYXCztX0FEscVCL5FA8x0KFKU6EkoV-qkQxaoGT4U/pub?gid=1089878008&single=true&output=csv

# Display Configuration
MAX_WIDTH=3840
MAX_HEIGHT=2160
frameRate=30

# Reload Configuration
reloadIntervalMinutes=5

# Logging Configuration
# Options: DEBUG, INFO, WARN, ERROR
logLevel=INFO

# Network Configuration
urlConnectionTimeout=30000
urlReadTimeout=30000

# Font Sizes (base values before scaling)
timeFontSize=300
salahTimeFontSize=160
salahTimeHeadingFontSize=104
todaysDateFontSize=90
countDownFontSize=700
largeCountDownFontSize=900
salahNameFontSize=600

# Right Pane Text Position (base values before scaling)
rightPaneTextX=3122
rightPaneTextY=1500

# Layout Coordinates (base values before scaling)
LAYOUT_RIGHT_PANE_X=2400
