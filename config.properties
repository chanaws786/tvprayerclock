LAYOUT_TIME_BACKGROUND_HEIGHT=400
LAYOUT_LEFT_MARGIN=10
LAYOUT_SALAH_NAME_X=50
LAYOUT_SALAH_NAME_Y=848
LAYOUT_SALAH_GAP=280
LAYOUT_BEGINS_ROW_X=800
LAYOUT_JAMAAT_ROW_X=2300
LAYOUT_HEADINGS_Y=600
LAYOUT_TIME_Y=320
LAYOUT_DATE_Y=200
LAYOUT_LOGO_Y=20
